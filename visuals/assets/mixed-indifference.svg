<svg xmlns="http://www.w3.org/2000/svg" width="760" height="505" viewBox="0 0 760 505" role="img" aria-labelledby="title desc">
  <title id="title">Mixed-strategy indifference intersection</title>
  <desc id="desc">EU of U equals 3q and EU of D equals 1 minus q. The two lines intersect at q equals one quarter, payoff equals three quarters.</desc>
  <rect width="760" height="505" rx="18" fill="#f8fafc"/>
  <text x="40" y="39" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324f">Mixed strategy: Expected-payoff intersection</text>
  <g stroke="#e3e9f1" stroke-width="1">
    <path d="M90 60H650 M90 180H650 M90 300H650"/>
    <path d="M230 60V420 M370 60V420 M510 60V420"/>
  </g>
  <path d="M90 60V420H650" fill="none" stroke="#40566c" stroke-width="2.5"/>
  <g fill="#40566c" font-family="Arial, sans-serif" font-size="13">
    <text x="85" y="439">0</text><text x="225" y="439">0.25</text><text x="365" y="439">0.50</text><text x="505" y="439">0.75</text><text x="645" y="439">1</text>
    <text x="68" y="424">0</text><text x="68" y="304">1</text><text x="68" y="184">2</text><text x="68" y="64">3</text>
    <text x="294" y="470" font-size="15" font-weight="600">Opponent probability of L: q</text>
    <text x="25" y="304" transform="rotate(-90,25,304)" font-size="15" font-weight="600">Expected payoff</text>
  </g>
  <path d="M90 420L650 60" stroke="#2563eb" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M90 300L650 420" stroke="#ed8936" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M230 330V420 M90 330H230" fill="none" stroke="#198468" stroke-dasharray="6 5" stroke-width="2"/>
  <circle cx="230" cy="330" r="8.5" fill="#198468" stroke="#ffffff" stroke-width="3"/>
  <rect x="246" y="279" width="195" height="49" rx="10" fill="#e4f5ef" stroke="#a0d9c6"/>
  <text x="258" y="299" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#136a52">Indifference point</text>
  <text x="258" y="318" font-family="Arial, sans-serif" font-size="13" fill="#136a52">q = 0.25, EU = 0.75</text>
  <rect x="440" y="78" width="195" height="76" rx="10" fill="#ffffff" stroke="#d9e2ed"/>
  <path d="M454 103H490" stroke="#2563eb" stroke-width="4"/>
  <text x="500" y="108" font-family="Arial, sans-serif" font-size="14" fill="#243b53">EU(U) = 3q</text>
  <path d="M454 138H490" stroke="#ed8936" stroke-width="4"/>
  <text x="500" y="143" font-family="Arial, sans-serif" font-size="14" fill="#243b53">EU(D) = 1 − q</text>
</svg>
