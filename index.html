/* Game Theory Study Desk · Edition 02
   Design: editorial research workspace / quiet academic minimalism
   Accessible contrast, stable layout, no decorative gradients. */
:root{

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.72 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

::selection{background:#d2e5e4;color:#152b31}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{height:100vh;overflow:auto;position:sticky;top:0;background:var(--sidebar);border-right:1px solid var(--line);padding:27px 16px 20px;scrollbar-width:thin}

.brand-title{font-size:15px;font-weight:750;color:var(--heading);letter-spacing:-.2px;line-height:1.3}.brand-sub{font-size:10px;line-height:1.7;color:var(--muted);letter-spacing:1.05px;font-weight:650}

/* Metrics displayed as a single information strip, not four marketing cards */

.topic-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.topic-heading .heading{margin-top:6px}.topic-heading .lead{max-width:800px}

  <script>
/* 基础知识来自可核对的标准博弈论模型；示例数字均单独标明为示例，不代表课件原题。 */
window.STUDY_DATA = (() => {
  const gh='https://github.com/ZeyuYu713/game-theory-learning/blob/main/';
  const src=(n,visual='')=>({notes:gh+`notes/lecture-${String(n).padStart(2,'0')}-${({1:'strategic-form-games',2:'strategic-form-games',3:'mixed-strategies',4:'extensive-form-games'})[n]||'strategic-form-games'}.md`,exercises:gh+`exercises/lecture-${String(n).padStart(2,'0')}-exercises.md`,visual:visual?gh+'visuals/'+visual:gh+'visuals/README.md'});
  const matrix=(rows,cols,cells,label='支付矩阵（行玩家收益，列玩家收益）')=>({type:'matrix',rows,cols,cells,label});
  const tree=(variant)=>({type:'tree',variant});
  const topics=[
    {id:'static',name:'静态博弈',category:'基础概念',lecture:1,status:'已建',intro:'参与者在同一决策阶段选择行动；分析各自对其他玩家策略的最佳反应。',points:['静态描述的是战略决策的时序与信息结构，而非现实中毫无时间流逝。','策略式博弈由参与者集合、策略空间与支付函数构成。','纯策略纳什均衡要求每个玩家的策略均为对其他玩家策略的最佳反应。'],assumptions:'以下数值为训练台自编的两人示例，行动同时选择，收益和规则均为共同知识。',model:['G=⟨N,(Sᵢ)ᵢ∈N,(uᵢ)ᵢ∈N⟩','N={1,2}；S₁={U,D}；S₂={L,R}','均衡条件：uᵢ(sᵢ*,s₋ᵢ*)≥uᵢ(sᵢ,s₋ᵢ*)，对所有 i、sᵢ 成立。'],diagram:matrix(['U','D'],['L','R'],[[[3,3],[0,4]],[[4,0],[1,1]]]),equilibrium:['玩家 1 的严格占优行动为 D；玩家 2 的严格占优行动为 R。','唯一纯策略纳什均衡 (D,R)，支付 (1,1)。'],mistakes:['把帕累托最优等同于纳什均衡。','只比较矩阵横向或纵向的收益，遗漏另一方的偏离。'],source:src(1,'01-strategic-matrix.md')},
    {id:'nash',name:'纳什均衡',category:'基础概念',lecture:1,status:'已建',intro:'最佳反应的共同交点：给定他人策略，每个参与者均无严格有利的单方偏离。',points:['纳什均衡允许弱最佳反应，故未必唯一或严格。','均衡不是社会最优、对每个人都最有利或合作协议。','求全部纯策略均衡时必须检查所有策略组合。'],assumptions:'采用与“静态博弈”相同的数值演示矩阵。',model:['BRᵢ(s₋ᵢ) = argmaxₛᵢ uᵢ(sᵢ,s₋ᵢ)','s* 为 NE ⇔ 对所有 i 有 sᵢ*∈BRᵢ(s₋ᵢ*)','严格 NE 要求每个玩家偏离至任一其他纯策略时收益严格下降。'],diagram:matrix(['U','D'],['L','R'],[[[3,3],[0,4]],[[4,0],[1,1]]]),equilibrium:['(D,R) 是双方最佳反应交点，因此为唯一纯策略 NE。','该模型中 (U,L) 的双方支付更高，但不是 NE。'],mistakes:['将单人偏离与双方同时改变策略混为一谈。','将严格 NE 与一般 NE 混用。'],source:src(1,'01-strategic-matrix.md')},
    {id:'bos',name:'性别战',category:'经典矩阵',lecture:1,status:'已建',intro:'双方均重视协调，但各自偏好的协调结果不同。',points:['通常存在两个纯策略协调均衡。','混合均衡中的混合概率由“使对方无差异”推导。','风险占优、帕累托排序与纳什均衡是不同问题。'],assumptions:'教学示例：双方同时决定参加歌剧 O 或足球 F。支付为约定的序数／基数效用示例。',model:['S₁=S₂={O,F}','当玩家 1 以概率 p 选 O、玩家 2 以概率 q 选 O 时：','玩家 1 无差异：2q=1−q；玩家 2 无差异：p=2(1−p)。'],diagram:matrix(['歌剧 O','足球 F'],['歌剧 O','足球 F'],[[[2,1],[0,0]],[[0,0],[1,2]]]),equilibrium:['纯策略 NE 为 (O,O) 和 (F,F)。','混合 NE：玩家 1 以 p=2/3 选择 O；玩家 2 以 q=1/3 选择 O。'],mistakes:['把“自身的混合概率”直接代入自身无差异方程。','只报告两个纯策略均衡，遗漏混合均衡。'],source:src(1,'01-strategic-matrix.md')},
    {id:'chicken',name:'斗鸡博弈',category:'经典矩阵',lecture:1,status:'已建',intro:'双方最想强硬而对手退让，但最忌讳双方同时强硬。',points:['典型反协调结构：双方各有机会成为强硬方。','承诺和行动顺序可能改变均衡选择，但须在动态博弈中建模。'],assumptions:'自编示例：S 表示坚持，Y 表示退让；(S,S) 支付为 (0,0)。',model:['S₁=S₂={S,Y}','最佳反应：对手 S 时选 Y；对手 Y 时选 S。','对称混合均衡无差异条件：3(1−q)=q+2(1−q)。'],diagram:matrix(['坚持 S','退让 Y'],['坚持 S','退让 Y'],[[[0,0],[3,1]],[[1,3],[2,2]]]),equilibrium:['纯策略 NE：(S,Y)、(Y,S)。','对称混合 NE：双方各以 1/2 概率选 S。'],mistakes:['误写 (Y,Y) 为纳什均衡：一方可改为 S 提高收益。','仅根据“冲突最坏”判断均衡，而不逐格检查。'],source:src(1,'01-strategic-matrix.md')},
    {id:'stag',name:'猎鹿博弈',category:'经典矩阵',lecture:1,status:'已建',intro:'互相配合可获得更高支付，单独追求高收益行动却面临协调失败风险。',points:['猎鹿代表高收益协调，猎兔代表相对安全行动。','常同时存在“高收益协调”与“低风险协调”纯策略均衡。'],assumptions:'自编示例：单方猎鹿失败得 0，猎兔恒得 3。',model:['S₁=S₂={鹿,兔}','当对方猎鹿概率为 q 时，自己猎鹿期望收益 4q；猎兔收益 3。','混合无差异阈值 q*=3/4。'],diagram:matrix(['鹿','兔'],['鹿','兔'],[[[4,4],[0,3]],[[3,0],[3,3]]]),equilibrium:['纯策略 NE：(鹿,鹿)、(兔,兔)。','对称混合 NE：双方猎鹿概率 3/4。'],mistakes:['将“(鹿,鹿) 总收益较高”直接当作唯一均衡依据。','混淆风险占优、收益占优和严格纳什均衡。'],source:src(1,'01-strategic-matrix.md')},
    {id:'mixed',name:'混合策略',category:'基础概念',lecture:3,status:'已建',intro:'玩家对纯策略分配概率；均衡时所有赋予正概率的行动均须为最佳反应。',points:['混合均衡的支持集内各纯行动对对手的混合策略必须无差异。','支持集外的行动预期收益不得更高。','只列无差异方程不足以证明均衡，还需概率合法性与偏离检验。'],assumptions:'采用性别战标准数值示例展示 2×2 支持集求解。',model:['σᵢ∈Δ(Sᵢ)，∑ₛσᵢ(s)=1，σᵢ(s)≥0。','完全混合时：E[uᵢ(sᵢ,σ₋ᵢ)] 对所有纯策略 sᵢ 相等。','性别战：q=1/3；p=2/3。'],diagram:matrix(['歌剧','足球'],['歌剧','足球'],[[[2,1],[0,0]],[[0,0],[1,2]]]),equilibrium:['玩家 1 歌剧概率 p=2/3，玩家 2 歌剧概率 q=1/3。','混合均衡中，各方对实际采用的两种纯行动无差异。'],mistakes:['把对方的均衡概率与自身的均衡概率颠倒。','未检查边界纯策略以及支持集外的获利偏离。'],source:src(3,'03-mixed-strategies.md')},
    {id:'cournot',name:'Cournot 产量竞争',category:'市场竞争',lecture:2,status:'已建',intro:'企业同时选择产量，市场价格随总产量下降；均衡由最佳反应函数交点确定。',points:['产量是策略变量，不是价格。','推导反应函数前应声明逆需求与成本、非负产量约束。','比较 Cournot 与 Stackelberg 时不能忽略行动时序。'],assumptions:'自编线性模型：P(Q)=a−bQ（相关区间内），Cᵢ(qᵢ)=cqᵢ，a>c、b>0，企业对称。',model:['πᵢ=(a−b(q₁+q₂)−c)qᵢ','∂πᵢ/∂qᵢ=a−c−2bqᵢ−bqⱼ=0','BRᵢ(qⱼ)=max{0,(a−c−bqⱼ)/(2b)}','q₁*=q₂*=(a−c)/(3b)'],diagram:{type:'cournot',label:'对称线性 Cournot 最佳反应交点'},equilibrium:['对称 NE：q₁*=q₂*=(a−c)/(3b)。','例如 a=100、b=1、c=20 时：每家产量 80/3，价格 140/3。'],mistakes:['把独占最优产量 (a−c)/(2b) 直接写成双寡头均衡产量。','计算反应函数时漏掉自己产量在 Q 中出现两次。'],source:src(2,'02-market-competition.md')},
    {id:'bertrand',name:'Bertrand 价格竞争',category:'市场竞争',lecture:2,status:'已建',intro:'同质产品、无产能限制、相同边际成本条件下，双方同时报价导致价格竞争至边际成本。',points:['价格是策略变量，低报价者取得市场需求。','同价如何分配需求、价格是否连续、产能是否受限，都影响反应函数。','Bertrand 均衡结论须带模型假设，不可直接用于差异化产品。'],assumptions:'同质产品、相同常数边际成本 c、无产能约束、消费者选择低价、同价各分一半，且成本价有正需求。',model:['pᵢ<pⱼ：πᵢ=(pᵢ−c)D(pᵢ)','pᵢ=pⱼ：πᵢ=1/2·(pᵢ−c)D(pᵢ)','pᵢ>pⱼ：πᵢ=0','标准对称纯策略均衡：p₁*=p₂*=c'],diagram:{type:'bertrand',label:'标准对称均衡与低价抢单机制'},equilibrium:['若 c=12，则在上述条件下 p₁*=p₂*=12，经济利润为 0。','对同质产品均衡 p=c 的理解，不能替代全部分段最佳反应推导。'],mistakes:['将连续价格下“略微降价”视为必然存在的精确最优报价。','忽略需求分配和产能假设。'],source:src(2,'02-market-competition.md')},
    {id:'hotelling',name:'Hotelling 位置竞争',category:'市场竞争',lecture:2,status:'已建',intro:'企业或候选人通过空间／政策位置影响需求或支持者分配。',points:['线性城市是位置选择模型；价格外生与价格内生模型应分别处理。','最小差异化结论依赖特定选址收益和消费者分布假设。'],assumptions:'教学版：两家企业同时在 [0,1] 选址；消费者均匀分布、选最近的企业、价格相同且外生、市场完全覆盖、同位置平分需求。',model:['企业 i 策略 xᵢ∈[0,1]；收益为被分配的消费者份额。','两位置不同时：无差异消费者位置 z=(x₁+x₂)/2。','对称均衡 x₁*=x₂*=1/2。'],diagram:{type:'median',label:'线性城市：消费者在 [0,1] 均匀分布'},equilibrium:['对称情况下两个企业均选在中位位置 x=1/2。','进一步引入价格竞争、交通成本或容量约束时需要重新求解。'],mistakes:['把 [0,1] 的几何中心无条件推广到非均匀人口分布。','混用政治选举模型与产品定价模型的目标函数。'],source:src(2,'02-market-competition.md')},
    {id:'median',name:'中位选民定理',category:'政治与公共决策',lecture:2,status:'已建',intro:'单峰偏好与单维政策竞争下，简单多数选择由中位选民的位置发挥关键作用。',points:['选民偏好需满足单峰性，并明确多数决策规则。','两候选人以得票最大化为目标的选址博弈中，政策趋向中位点。','不能在多维政策和非单峰偏好下一概套用。'],assumptions:'单一政策轴、奇数选民或有唯一中位点、单峰偏好、两候选人只追求得票、信息完全。',model:['选民偏好峰值 z₁,…,zₙ；其中位值 m。','两候选人位置 x₁,x₂∈[0,1]。','标准 Downs 位置竞争均衡：x₁*=x₂*=m。'],diagram:{type:'median',label:'中位点 m 与候选人政策选择'},equilibrium:['标准两候选人政策竞争模型中的纯策略 NE 为 (m,m)。','中位选民政策在成对多数比较中具有核心地位（满足相应偏好假设时）。'],mistakes:['直接用算术平均数代替中位数。','漏写单维、单峰及投票规则等必要前提。'],source:src(2,'02-market-competition.md')},
    {id:'attrition',name:'消耗战',category:'动态与时机',lecture:2,status:'已建',intro:'双方争夺一个有价值的对象，退出时间与持续等待成本决定收益。',points:['消耗战不仅取决于争夺物价值，还取决于等待成本与谁先退出。','对手继续坚持时，自己是否愿意继续等待取决于后续净收益。','连续时间模型的平局与同时退出规则须单独声明。'],assumptions:'自编标准简化模型：每位玩家预先选择退出时刻 tᵢ≥0；单位等待成本 k>0；奖品价值 V>0；先退出者放弃奖品，争夺在首次退出时停止；同刻退出时等概率获得奖品。',model:['若 tᵢ<tⱼ，则 uᵢ=−k tᵢ。','若 tᵢ>tⱼ，则 uᵢ=V−k tⱼ。','若 tᵢ=tⱼ，则 uᵢ=V/2−k tᵢ。','在该版本下，(0,t) 与 (t,0) 对所有 t≥V/k、t>0 都是纯策略 NE。'],diagram:{type:'attrition',label:'等待时间越长，累积成本越高'},equilibrium:['存在不对称纯策略均衡：一方立即退出，另一方承诺至少坚持至 V/k。','其他时间结构、退出规则与信息条件下应单独分析。'],mistakes:['错误地令赢家支付自己声明的退出时刻成本；本模型实际支付争夺终止时的等待成本。','忽略同时退出时的支付规则。'],source:src(2,'02-market-competition.md')},
    {id:'tax',name:'纳税博弈',category:'监督与稽查',lecture:3,status:'已建',intro:'纳税人决定是否逃税，税务机关决定是否稽查；内点混合均衡由两方无差异条件共同确定。',points:['稽查概率由纳税人两项行动的无差异条件决定。','逃税概率由税务机关稽查与不稽查的收益比较决定。','模型参数如罚金、征税收益、稽查成本的定义必须清楚。'],assumptions:'自编参数化支付：纳税人逃税成功获益 B，查获罚损 F；机关查获逃税得 R−c，不查获逃税损失 L，稽查成本 c。B,F,R,L,c>0，且 0<c<R+L。',model:['纳税人逃税概率 x，税务机关稽查概率 q。','纳税人无差异：−Fq+B(1−q)=0 ⇒ q*=B/(B+F)。','机关无差异：(R−c)x−c(1−x)=−Lx ⇒ x*=c/(R+L)。'],diagram:matrix(['逃税 E','依法申报 H'],['稽查 I','不稽查 N'],[[['−F','R−c'],['B','−L']],[[0,'−c'],[0,0]]]),equilibrium:['内点混合均衡：逃税概率 x*=c/(R+L)，稽查概率 q*=B/(B+F)。','示例 B=2、F=4、R=3、L=2、c=1 时，x*=1/5，q*=1/3。'],mistakes:['把稽查概率的方程写成机关自己无差异。','忽略概率是否位于 [0,1] 以及边界条件。'],source:src(3,'03-mixed-strategies.md')},
    {id:'dynamic',name:'动态博弈',category:'序贯决策',lecture:4,status:'已建',intro:'参与者按照一定顺序决策，后行动者可能观察先前行动并调整策略。',points:['需要区分行动、完整策略以及实际均衡路径。','是否观察到先前行动由信息集表述。','不能仅据“先后行动”断言完美信息。'],assumptions:'采用课程仓库第四讲“进入阻遏”示例，后行动者可观察进入选择。',model:['玩家 1：进入 In 或退出 Out。','Out ⇒ (1,2)；In 后玩家 2 选容纳 A ⇒ (2,1) 或价格战 F ⇒ (0,0)。','完整策略：S₁={In,Out}；S₂={A,F}。'],diagram:tree('entry'),equilibrium:['NE={(In,A),(Out,F)}。','SPNE={(In,A)}；实际路径为 In→A。'],mistakes:['把后行动者的宣称当作自动可信。','只写均衡路径而漏写未触及节点的完整应对。'],source:src(4,'04-extensive-form.md')},
    {id:'extensive',name:'扩展式博弈',category:'序贯决策',lecture:4,status:'已建',intro:'用有向博弈树描述历史、节点、行动、信息集与终点收益。',points:['每个信息集表示行动者无法区分的若干节点。','一份纯策略必须对该玩家的每个信息集指定可执行行动。','信息集被连接时，不得随意把其中某个节点单独截为子博弈。'],assumptions:'训练台自编不完美信息演示：玩家 1 先选 L/R，玩家 2 行动但观察不到 L/R。',model:['玩家 1 策略 S₁={L,R}。','玩家 2 的两处决策节点在同一个信息集，因此 S₂={U,D}，而不是 {UU,UD,DU,DD}。','该例完全信息（规则及支付共同知识），但不是完美信息。'],diagram:tree('information'),equilibrium:['采用示例支付时，纯策略 NE 为 (L,U)、(R,D)。','玩家 2 无法根据 L/R 分别采取不同动作；此信息集不能拆分为两个真子博弈。'],mistakes:['把行动次序当作可观测性。','用无法观察的历史条件来定义后行动者的策略。'],source:src(4,'04-extensive-form.md')},
    {id:'backward',name:'逆向归纳',category:'序贯决策',lecture:4,status:'已建',intro:'有限完美信息博弈从末端最优行动开始，逐步求得先行动者的最优策略。',points:['倒推必须检查所有可到达及未到达的子博弈。','同收益并列最大时应保留全部最优行动。','实际路径和完整均衡策略需要分别报告。'],assumptions:'采用课程仓库第四讲习题 3 的三阶段博弈（C/D、E/F、G/H）。',model:['玩家 1 的完整策略 S₁={CG,CH,DG,DH}；玩家 2：S₂={E,F}。','最深处：G 给玩家 1 收益 1，H 给 0 ⇒ G。','玩家 2：E→G 时收益 2，F 收益 1 ⇒ E。','根节点玩家 1：C→E→G 时收益 1，D 时收益 2 ⇒ D。'],diagram:tree('three'),equilibrium:['唯一纯策略 SPNE 为 (DG,E)。','均衡路径仅 D，终点支付 (2,0)。'],mistakes:['只按实际路径选行动，漏写 G 这类离路径选择。','并列最优时任意删除分支，漏报均衡。'],source:src(4,'04-extensive-form.md')},
    {id:'threat',name:'可信威胁',category:'序贯决策',lecture:4,status:'已建',intro:'威胁的可信性取决于相关续局被实际到达时，执行威胁是否仍为最佳反应。',points:['普通 NE 可能依赖离路径上的不可信计划。','SPNE 要求每个子博弈内部也满足纳什均衡。','可信承诺需要在模型中通过可执行、可观测的约束或改变支付来体现。'],assumptions:'采用课程仓库第四讲习题 2 的进入阻遏支付；In→A (2,1)，In→F (0,0)，Out (1,2)。',model:['后进入子博弈：在位企业容纳 A 得 1、打价格战 F 得 0，因此选 A。','进入者预见 A：In 收益 2，Out 收益 1，因此选 In。','(Out,F) 虽是 NE，但 F 在进入后的节点不是最优行动。'],diagram:tree('entry'),equilibrium:['纯策略 NE={(In,A),(Out,F)}。','唯一 SPNE={(In,A)}；威胁 F 不可信。'],mistakes:['认为不存在单边改进就自动满足 SPNE。','把对方“声称”会做的行动当成其均衡续局行为。'],source:{...src(4,'04-extensive-form.md'),visual:gh+'visuals/credible-threat-market-entry.md'}}

  const add=(id,topic,difficulty,kind,prompt,opts,answer,steps,error,contrast,origin='训练台自编示例')=>qs.push({id,topic,difficulty,kind,prompt,options:opts,answer,steps,error,contrast,origin});
  add('Q01','static','基础题','choice','矩阵：U/L=(3,3)，U/R=(0,4)，D/L=(4,0)，D/R=(1,1)。唯一纯策略纳什均衡是什么？',['(U,L)','(D,R)','(U,R)','(D,L)'],1,['对玩家 1，面对 L 时 D 得 4>3；面对 R 时 D 得 1>0，因此 D 严格占优。','对玩家 2，面对 U 时 R 得 4>3；面对 D 时 R 得 1>0，因此 R 严格占优。','双方最佳反应相交于 (D,R)。'],'选 (U,L) 常因其双方收益更高，但它不满足单边不偏离。','纳什均衡与帕累托最优');
  add('Q02','nash','基础题','choice','下列哪句话准确描述一般纳什均衡？',['每个玩家都取得其可能的最高收益','没有任何玩家能够通过单独改变自身策略严格提高收益','所有玩家的收益之和最大','总能由严格占优策略得到'],1,['固定其他玩家的策略，考察每个玩家的全部单边偏离。','均衡条件只要求不存在严格有利的单边偏离。','一般 NE 可以是弱均衡，也可以有多个。'],'把“纳什”理解成“社会最优”或“每个人都满意”。','NE、严格 NE、帕累托效率');
  add('Q03','bos','基础题','choice','性别战矩阵：对角线支付 (O,O)=(2,1)，(F,F)=(1,2)，非对角均为 (0,0)。纯策略 NE 有几个？',['0 个','1 个','2 个','4 个'],2,['(O,O) 时任一方单独改变都由正收益变为 0。','(F,F) 同理，两人均不愿单独偏离。','非对角位置总有一方可通过协调获得正收益。'],'只报告自己偏好的协调点，忽略另一个点。','多重纯策略均衡');
  add('Q04','bos','综合题','numeric','在性别战矩阵 (2,1)、(0,0)、(0,0)、(1,2) 中，玩家 1 以概率 p 选择歌剧。为让玩家 2 对歌剧和足球无差异，p = ?（填小数）',[],2/3,['玩家 2 选择歌剧的期望收益为 p。','选择足球的期望收益为 2(1−p)。','令 p=2(1−p)，解得 p=2/3≈0.6667。'],'易把玩家 1 和玩家 2 的混合概率交换。','谁无差异、求谁的概率');
  add('Q05','chicken','基础题','choice','斗鸡博弈：坚持/坚持 (0,0)，坚持/退让 (3,1)，退让/坚持 (1,3)，退让/退让 (2,2)。哪个不是纯策略 NE？',['(坚持,退让)','(退让,坚持)','(退让,退让)','以上两项都是 NE'],2,['在 (退让,退让)，任一方改为坚持可将自己的收益由 2 提高到 3。','因此该格不是 NE；两种不对称结果才是纯策略 NE。'],'误以为“双方都退让”最和平，所以应是均衡。','支付高低与单边最优');
  add('Q06','stag','基础题','choice','猎鹿矩阵：鹿鹿 (4,4)，鹿兔 (0,3)，兔鹿 (3,0)，兔兔 (3,3)。下列哪些是纯策略 NE？',['仅鹿鹿','仅兔兔','鹿鹿和兔兔','所有格'],2,['在鹿鹿时单方去猎兔由 4 降为 3。','在兔兔时单方去猎鹿由 3 降为 0。','其他两格存在获利偏离。'],'用收益优势排除风险较低的协调均衡。','收益占优与风险占优');
  add('Q07','mixed','综合题','choice','求 2×2 完全混合均衡时，下列哪一步是正确的？',['让自己在自己的混合概率下无差异','用对方的混合概率使自己的纯行动期望收益相等','只需要概率非负','只需枚举两个纯策略均衡'],1,['设玩家 1 混合概率 p、玩家 2 混合概率 q。','用 q 使玩家 1 在自己的支持集行动之间无差异。','用 p 使玩家 2 在自己的支持集行动之间无差异，再检查支持集外偏离。'],'混淆决定无差异的概率属于哪位玩家。','混合概率与支持集检验');
  add('Q08','mixed','提高题','self','解释为什么“令支持集内纯行动无差异”本身不足以证明一个候选混合策略组合是 NE。',[],'支持集内的行动必须是最佳反应，且支持集外不存在更高预期收益的纯行动；同时要验证全部概率非负且总和为 1，并逐方检查在给定对手混合策略下不能通过任意混合偏离改善收益。',['先由无差异条件解出候选概率和支持集。','核查每个概率处于 [0,1] 且同一玩家概率之和为 1。','比较支持集外纯行动的预期收益，必须不超过支持集内。','逐方确认不存在获利单边偏离，因此构成 NE。'],'把必要条件当作充分条件。','无差异条件与最佳反应条件');
  add('Q09','cournot','基础题','numeric','对称 Cournot：P=100−(q₁+q₂)，两家边际成本均为 20。求每家企业的均衡产量 q*（小数）。',[],80/3,['利润 πᵢ=(100−qᵢ−qⱼ−20)qᵢ。','对 qᵢ 求导：80−2qᵢ−qⱼ=0，因此 qᵢ=(80−qⱼ)/2。','对称均衡 qᵢ=qⱼ=q，解得 3q=80，即 q=80/3≈26.6667。'],'把 40（独占最优产量）当成每家 Cournot 产量。','Cournot 与垄断产量');
  add('Q10','cournot','综合题','numeric','延续上一题 Cournot 示例：P=100−Q，c=20，q₁*=q₂*=80/3。均衡市场价格 P* 是多少？',[],140/3,['均衡总产量 Q*=160/3。','代入逆需求 P*=100−160/3=(300−160)/3=140/3≈46.6667。'],'把单个企业产量当作总产量。','均衡产量与均衡价格');
  add('Q11','bertrand','基础题','choice','同质产品、同质企业、无产能约束、相同常数边际成本 c=12 的标准 Bertrand 博弈中，纯策略均衡价格为？',['p=6','p=12','p=18','必定没有纯策略均衡'],1,['同价且高于成本时，单方略微降价可抢占市场并获利。','双方报价低于成本无法取得正利润。','两者都报 c 时，单方提高价格会失去需求，降低价格则产生负单位利润。'],'把 Cournot 的高于边际成本结论直接套到 Bertrand。','产量竞争与价格竞争');
  add('Q12','bertrand','提高题','self','为什么在连续价格空间中，“总能比对手便宜一分钱”不能直接作为 Bertrand 最佳反应函数的严格推导？',[],'连续价格可无限接近对手价格，但不存在最小的正降价幅度；当企业希望以尽可能高但严格低于对手的报价获取整个市场时，利润可能只有上确界而没有最大值。须区分连续与离散报价机制，且考虑垄断最优价、成本和需求边界。',['先固定对手价格 pⱼ，分 pᵢ<pⱼ、pᵢ=pⱼ、pᵢ>pⱼ 三段写利润。','在可获利的抢占市场区间，比较不断接近 pⱼ 的报价。','连续实数中不存在“严格小于 pⱼ 的最大数”；只有上确界时，argmax 为空。','若报价按最小货币单位离散，则可以分析有限的降价步长。'],'把利润上确界误当作必然存在的最优报价。','supremum 与 maximum');
  add('Q13','hotelling','基础题','choice','标准一维均匀分布选址博弈，价格相同且外生、两家市场份额最大化，均衡位置通常为？',['两端 0 和 1','两家都在 1/2','任意一对不同位置','均匀分散在 1/4 与 3/4'],1,['若对方在中位点，一方移开中位点会损失部分市场份额。','两家同在 1/2 时均分市场，各得 1/2。','这依赖统一价格、均匀人口分布等设定。'],'把最大差异化直觉套到该特定最小差异化模型。','位置与价格的联合竞争');
  add('Q14','median','基础题','choice','五位选民的理想政策点依次为 1、2、3、7、9。单峰偏好下的中位选民政策点 m 是？',['3','4.4','5','7'],0,['从小到大排序得到 1、2、3、7、9。','奇数个选民的中位点为第三个观测值 3。','均值 (1+2+3+7+9)/5=4.4 不是中位点。'],'把均值与中位点混淆。','中位数与均值');
  add('Q15','attrition','基础题','choice','消耗战“谁先退出争夺就结束”的模型中，先退出者收益为 −ktᵢ，赢者收益为 V−k·min(tᵢ,tⱼ)。哪项表述正确？',['胜者始终支付自己声明的全部等待时长','结果需考虑争夺何时终止及退出先后','必然双方同时选择退出','只有收益矩阵，没有连续行动空间'],1,['比赛在第一个退出发生时终止。','赢家虽可能声明较晚退出，但实际等待成本只累计到对手先退出的时刻。','因此仅知道双方声明时间，还必须看退出次序。'],'将策略中的 tᵢ 与实际终止时刻混为一谈。','计划等待时间与实际等待成本');
  add('Q16','tax','基础题','numeric','纳税稽查模型：成功逃税收益 B=2，查获损失 F=4。内点混合均衡中，机关稽查概率 q* 为多少？（小数）',[],1/3,['纳税人逃税期望收益 = (1−q)B−qF。','依法申报收益按基准归一为 0。','令 (1−q)·2−4q=0，得 q=1/3≈0.3333。'],'用机关的无差异条件来求机关自己的稽查概率。','概率归属与无差异方程');
  add('Q17','tax','综合题','numeric','同一税收模型：R=3，L=2，稽查成本 c=1。内点混合均衡中纳税人逃税概率 x* 为多少？',[],1/5,['机关稽查的期望收益为 x(R−c)+(1−x)(−c)=xR−c。','不稽查的期望收益为 −xL。','令 xR−c=−xL，得 x=c/(R+L)=1/5=0.2。'],'把 q*=B/(B+F) 当作逃税概率。','机关收益与逃税概率');
  add('Q18','dynamic','基础题','choice','进入者先选 In/Out，在位者在 In 后选 A/F。要描述在位者纯策略，哪项正确？',['仅“什么也不做”','在位者事先计划若 In 发生就选 A 或 F','必须同时选 A 和 F','只写均衡路径即可'],1,['在位者是否真正行动取决于进入者此前是否选择 In。','但作为扩展式完整策略，仍要为可能发生的那个信息集指定行动。','因此可行纯策略为 A 或 F。'],'把实际执行动作当作策略的全部内容。','纯策略与均衡路径');
  add('Q19','extensive','综合题','choice','玩家 1 先选 L/R，玩家 2 后行动但无法观察 L/R。玩家 2 在 L/R 后的两个节点属于同一信息集，可以采用哪种纯策略？',['L 后 U、R 后 D','L 后 D、R 后 U','无论实际节点为何都选 U','根据 L/R 临时判断'],2,['信息集表示玩家 2 无法区分两个具体节点。','策略必须在信息集层面指定唯一可执行行动。','因此只能统一选 U 或统一选 D。'],'用无法观察到的前序行动定义条件策略。','信息集、完美信息与完全信息');
  add('Q20','extensive','提高题','self','说明为什么含两个节点的信息集不能被拆分为两个独立子博弈，并说明对逆向归纳方法的影响。',[],'子博弈必须从单节点信息集开始，包含其所有后继节点，不得切断任一信息集。含两个节点的信息集不能单独从其中一个节点作为子博弈起点；若无相应真子博弈，就不能把完美信息下逐节点倒推的步骤机械套用，需要分析整个信息集上的最佳反应与适用均衡概念。',['检查候选子博弈起点是否为单节点信息集。','检查所有后继节点是否完整包含，是否切断其他信息集。','如果起点所属信息集含多个节点，就不能独立截取。','再根据博弈的信息结构决定使用策略式 NE、SPNE 或额外信念一致性工具。'],'把“博弈树上的任何分支”都当作完整子博弈。','子博弈的正式定义与不完美信息');
  add('Q21','backward','基础题','choice','三阶段博弈：根节点玩家 1 选 D 得 (2,0)，选 C 则玩家 2 选 F 得 (3,1)，选 E 后玩家 1 在 G=(1,2)、H=(0,0) 间选。逆向归纳的第一步应是？',['根节点直接比较 2 与 3','末端玩家 1 在 G 与 H 中选 G','玩家 2 立即选 F','比较所有终点收益总和'],1,['在最后节点玩家 1 比较 G 给自己 1、H 给自己 0。','因此在此节点选 G。','把 G 的续局结果向前传递，再决定玩家 2、最后决定根节点。'],'跳过后续玩家的理性选择，直接比较未必能实现的终点。','逆向归纳与各节点最优性','仓库第四讲习题 3（改写呈现）');
  add('Q22','backward','综合题','choice','延续上题，完整纯策略 SPNE 是哪一项？',['(CH,F)','(DG,E)','(DH,E)','(CG,F)'],1,['最深处玩家 1 选 G。','玩家 2 比较 E 后自己得 2、F 得 1，故选 E。','根节点玩家 1 比较 C 后得 1、D 得 2，故选 D。','玩家 1 的完整策略需同时写根节点 D 与后续节点 G，所以 (DG,E)。'],'只写路径 D，漏掉完整策略中的 G；或将普通 NE 当成 SPNE。','均衡路径与完整策略','仓库第四讲习题 3（改写呈现）');
  add('Q23','threat','基础题','choice','进入阻遏博弈：Out 得 (1,2)，In 后在位企业 A 得 (2,1)、F 得 (0,0)。哪一个 NE 不能通过 SPNE 检验？',['(In,A)','(Out,F)','两者均通过','两者均不通过'],1,['普通 NE 包括 (In,A) 与 (Out,F)。','一旦 In 发生，在位企业选 A 得 1，大于选 F 的 0。','因此 (Out,F) 依赖不可信的 F，不能在进入子博弈保持最优。'],'误以为普通 NE 必然排除不可信威胁。','NE 与 SPNE','仓库第四讲习题 2（改写呈现）');
  add('Q24','threat','提高题','self','将进入阻遏模型改为：In→A (2,1)，In→F (0,3)，Out (1,2)。此时威胁 F 是否可信？求纯策略 SPNE。',[],'F 在进入后给在位企业 3，高于 A 的 1，因此 F 是进入子博弈中的严格最佳反应；进入者预见 F 后，In 得 0，Out 得 1，因此唯一 SPNE 为 (Out,F)。',['先固定 In 已发生，比较在位企业在 A 与 F 下收益 1 和 3。','后行动者选择 F，属于可执行的理性威胁。','回到根节点，进入者比较 In→F 的 0 与 Out 的 1。','选择 Out，完整 SPNE 为 (Out,F)。'],'只根据“价格战”名称判定不可信，而非依据支付比较。','可信性随续局支付结构改变');
  add('Q25','static','综合题','self','请解释为什么 (U,L) 支付 (3,3) 高于 (D,R) 支付 (1,1)，但不构成静态博弈矩阵的纳什均衡。',[],'在 (U,L)，玩家 1 如果单方由 U 改成 D，其收益从 3 增至 4；玩家 2 如果由 L 改为 R，其收益从 3 增至 4。因此存在严格有利的单方偏离，(U,L) 不是 NE。双方共同变为 (U,L) 可能帕累托改进，但不满足现有互动下的偏离稳定性。',['固定玩家 2 选 L，比较玩家 1 的 U/D 收益：3 与 4。','固定玩家 1 选 U，比较玩家 2 的 L/R 收益：3 与 4。','任意一个获利单边偏离已经足以否定 NE。'],'只比较两条对角线的总收益。','帕累托效率不意味着稳定性');
  add('Q26','median','提高题','self','单维多数决与两候选人位置竞争中，中位选民定理需要哪些关键条件？若政策变成二维是否还能不加说明地给出 (m,m)？',[],'须说明单一政策维度、选民理想点上的单峰偏好、适当的多数投票规则，以及候选人得票／胜选目标。二维政策不存在单一有序中位点，典型多数关系可能发生循环，因此不能无条件沿用 (m,m) 结论。',['列出政策空间的一维性和偏好的单峰性。','说明中位点的多数比较作用。','若要把它推广为两候选人选址均衡，还需明确投票与候选人目标函数。','说明二维情形不具有可直接照搬的中位点规则。'],'把中位数的直观几何性质当作无条件均衡定理。','中位选民定理与 Downs 竞争');
  add('Q27','attrition','提高题','self','消耗战：两人选择退出时刻 tᵢ，奖品 V=6、单位等待成本 k=2。解释为何 (t₁,t₂)=(0,3) 可成为自编模型中的纯策略 NE。',[],'玩家 1 立即退出得 0；若改成 t₁<3 的正数则支付 −2t₁<0；若改成 t₁>3 则赢奖品 6 但须等待 3 单位，支付 6−2×3=0，并未严格提高；同时退出 t₁=3 时得 3−6=−3。玩家 2 面对玩家 1 在 t₁=0 立即退出，只要自己 t₂>0 就立即获奖品 6，无须承担等待成本，改为 t₂=0 平局仅得 3，因此无有利偏离。', ['核查玩家 1 固定 t₂=3 时的全部可能偏离区间。','核查玩家 2 固定 t₁=0 时，t₂>0 的收益均为 V。','双方都无严格获利偏离，因此构成 NE。'],'把 t₂=3 误当作胜者实际支付 3 单位等待成本。','纯策略非对称均衡与偏离检验');
  add('Q28','hotelling','综合题','choice','Hotelling 位置竞争与标准 Bertrand 价格竞争的关键区别是？',['两者都以价格为唯一策略','前者在简化版中选位置并争夺消费者，后者选价格并争夺需求','两者都必然没有均衡','两者均只讨论政府税务'],1,['Hotelling 简化版的策略为位置 xᵢ，收益取决于位置与消费者分布。','Bertrand 简化版的策略为价格 pᵢ，收益取决于成交价、成本与消费者选择。','两者的均衡和比较静态不能互换。'],'把“市场竞争”所有模型使用同一组策略变量。','位置竞争与价格竞争');
  add('Q29','chicken','综合题','numeric','斗鸡矩阵：坚持/坚持 (0,0)，坚持/退让 (3,1)，退让/坚持 (1,3)，退让/退让 (2,2)。对手以概率 q 坚持，使自己坚持与退让无差异的 q 为多少？',[],0.5,['自己坚持的期望支付为 0·q+3(1−q)=3−3q。','自己退让的期望支付为 1·q+2(1−q)=2−q。','令 3−3q=2−q，解得 q=1/2。'],'将坚持收益 (0,3) 与退让收益 (1,2) 对错对象。','两行动无差异计算');
  add('Q30','stag','综合题','numeric','猎鹿示例：鹿鹿 (4,4)，鹿兔 (0,3)，兔鹿 (3,0)，兔兔 (3,3)。对手猎鹿概率至少达到多少，自己猎鹿才不劣于猎兔？（输入阈值）',[],0.75,['自己猎鹿期望收益为 4q，猎兔恒为 3。','猎鹿不劣于猎兔 ⇔4q≥3。','临界概率 q=3/4=0.75。'],'将风险选择门槛与混合均衡“人人随机化”混为一谈。','期望收益临界值');
  const extra=[
    {name:'重复博弈',lecture:5,note:'有限与无限重复博弈、触发策略、折现因子',notePath:'notes/lecture-05-repeated-games.md'},
    {name:'讨价还价',lecture:6,note:'交替报价、折现与拒绝条件',notePath:'notes/lecture-06-bargaining.md'},
    {name:'贝叶斯博弈',lecture:7,note:'类型、共同先验、信念和 BNE',notePath:'notes/lecture-07-bayesian-games.md'},
    {name:'动态贝叶斯博弈',lecture:8,note:'信号、信息集、序贯理性与信念更新',notePath:'notes/lecture-08-dynamic-bayesian-games.md'},
    {name:'合作博弈',lecture:9,note:'联盟价值、核心与 Shapley 值',notePath:'notes/lecture-09-cooperative-games.md'}
  ].map(x=>({...x,notes:gh+x.notePath,exercises:gh+`exercises/lecture-${String(x.lecture).padStart(2,'0')}-exercises.md`}));
  return {topics,questions:qs,extra,repo:'https://github.com/ZeyuYu713/game-theory-learning',audit:gh+'guides/slide-coverage-audit.md',index:gh+'guides/exam-topic-index.md',comprehensive:gh+'guides/comprehensive-practice.md',visuals:gh+'visuals/README.md'};
})();

</script>
  <script>
(() => {
'use strict';
const DATA=window.STUDY_DATA, KEY='game-theory-training-desk-v1';
const topicMap=Object.fromEntries(DATA.topics.map(t=>[t.id,t]));
const defaultDb=()=>({attempts:[],read:[],visited:{},supplements:[],userQuestions:[],schedule:{}});
let db=defaultDb(), storageStatus='ok';try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object') db={...defaultDb(),...x};}catch(e){storageStatus='unavailable'}
const ui={page:'home',topic:'threat',category:'全部',search:'',topicTab:'all',qFilter:'all',difficulty:'all',questionId:'Q23',draft:'',choice:-1,revealed:false,graded:null,matrixSelected:null,treeSelected:null,reviewOnly:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const u=s=>/^https?:\/\//i.test(String(s||'').trim())?String(s).trim():'';
const dateFmt=timestamp=>new Date(timestamp).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
const allQuestions=()=>[...DATA.questions,...(db.userQuestions||[])];
const questionById=id=>allQuestions().find(q=>q.id===id);
const lastOutcomes=()=>{const ret={};(db.attempts||[]).forEach(a=>ret[a.question]=a);return ret};
const wrongQuestions=()=>{let r=lastOutcomes();return allQuestions().filter(q=>r[q.id]&&r[q.id].correct===false)};
const dueQuestions=()=>{const now=Date.now(),r=lastOutcomes();return allQuestions().filter(q=>r[q.id]&&(!db.schedule[q.id]||db.schedule[q.id].due<=now))};
const accuracy=()=>db.attempts.length?Math.round(db.attempts.filter(a=>a.correct).length/db.attempts.length*100):0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageStatus='ok';return true}catch(e){storageStatus='unavailable';return false}}
const icon=(type)=>({home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',practice:'<path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9"/><path d="m9 11 3 3L22 4"/>',review:'<path d="M3 12a9 9 0 1 0 3-7"/><path d="M3 3v6h6"/><path d="M12 7v5l4 2"/>',manage:'<path d="M12 20h9"/><path d="m16.5 3.5 4 4-12 12-5 1 1-5z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>'})[type]||'';
const ico=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icon(name)}</svg>`;
function navButton(page,label,sub=''){return `<button class="nav-button ${ui.page===page?'active':''}" data-action="nav" data-page="${page}">${ico(page==='home'?'home':page==='topics'||page==='topic'?'book':page==='trainer'?'practice':page==='review'?'review':'manage')}${esc(label)}${sub?`<span class="count">${esc(sub)}</span>`:''}</button>`}
function layout(main){const names={home:'学习总览',topics:'专题目录',topic:topicMap[ui.topic]?.name||'专题学习',trainer:'题目训练',review:'错题复盘',manage:'内容管理'};
 const quick=DATA.topics.slice(0,7),rest=DATA.topics.slice(7);
 const item=t=>`<button class="sidebar-topic ${ui.page==='topic'&&ui.topic===t.id?'active':''}" data-action="topic" data-topic="${t.id}">${esc(t.name)}<span class="dot ${db.read.includes(t.id)?'done':''}"></span></button>`;
 return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">G</div><div><div class="brand-title">博弈论研习室</div><div class="brand-sub">GAME THEORY STUDIO</div></div></div><div class="nav-h">WORKSPACE / 工作区</div>
 ${navButton('home','学习总览')}${navButton('topics','专题目录',String(DATA.topics.length))}${navButton('trainer','题目训练',String(allQuestions().length))}${navButton('review','错题复盘',String(wrongQuestions().length))}${navButton('manage','内容管理')}
 <div class="nav-h">INDEX / 专题索引</div>${quick.map(item).join('')}<details class="sidebar-more" ${ui.page==='topic'&&rest.some(t=>t.id===ui.topic)?'open':''}><summary>更多专题 · ${rest.length}</summary>${rest.map(item).join('')}</details>
 <div class="sidebar-foot">BEIHANG UNIVERSITY · 2026<br/>独立学习记录保存在当前浏览器。<br/>可通过导出功能备份。</div></aside>
 <div class="main"><header class="topbar"><div class="crumb"><span>课程研究台</span><span class="slash">/</span><strong>${esc(names[ui.page])}</strong></div><div class="top-actions"><span class="pill-status">${storageStatus==='ok'?'本地记录已启用':'本地存储受限'}</span><button class="small-btn" data-action="export">导出学习记录 ↗</button></div></header>
 <div class="mobile-nav">${[['home','总览'],['topics','专题'],['trainer','做题'],['review','错题'],['manage','管理']].map(([p,n])=>`<button data-action="nav" data-page="${p}" class="${ui.page===p?'active':''}">${n}</button>`).join('')}</div>
 <main class="content" id="main-content">${main}<footer class="footer">资料来源：<a href="${DATA.repo}" target="_blank" rel="noopener noreferrer">game-theory-learning</a> 课程仓库与经典博弈论模型 · 原仓库练习与新编交互题分开维护。待核对的课件内容保留“待补充”。<br/>GAME THEORY STUDY STUDIO / LEARNING EDITION 02　·　所有练习记录保存在此浏览器。</footer></main></div></div>`;
}
function latestActivity(){return [...(db.attempts||[])].slice(-5).reverse()}
function renderHome(){const recent=latestActivity(),complete=db.read.length;
 const focus=['threat','backward','mixed','nash','cournot','tax'].map(id=>topicMap[id]).filter(Boolean);

function qOptions(){let qs=allQuestions().filter(q=>(ui.qFilter==='all'||q.topic===ui.qFilter)&&(ui.difficulty==='all'||q.difficulty===ui.difficulty));if(ui.reviewOnly){const ids=new Set(dueQuestions().map(q=>q.id));qs=qs.filter(q=>ids.has(q.id));}return qs}
function parseMath(s){s=String(s||'').trim();if(/^[-+]?\d+(\.\d+)?\s*\/\s*[-+]?\d+(\.\d+)?$/.test(s)){const [a,b]=s.split('/').map(Number);return b!==0?a/b:NaN}if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);return NaN}

function renderReview(){const wrong=wrongQuestions(),due=dueQuestions(),total=db.attempts.length;let counts={};db.attempts.filter(a=>!a.correct).forEach(a=>{counts[a.errorTag]=(counts[a.errorTag]||0)+1});const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,7);const groups=DATA.topics.map(t=>{let a=db.attempts.filter(x=>x.topic===t.id),bad=a.filter(x=>!x.correct);return {topic:t,all:a.length,bad:bad.length,rate:a.length?Math.round(bad.length/a.length*100):0}}).filter(x=>x.all).sort((a,b)=>b.rate-a.rate);
 return `<div class="eyebrow">REVIEW / RETENTION</div><h1 class="heading">错题复盘与学习进度</h1><p class="lead">按照历史作答记录生成错误类型统计和薄弱专题。错题不因一次重新打开题目而消失；需答对后才更新其最近一次结果。</p><div class="kpis"><div class="kpi"><div class="k">历史作答</div><div class="v">${total}</div><div class="note">包含重复训练</div></div><div class="kpi"><div class="k">历史错误次数</div><div class="v">${db.attempts.filter(a=>!a.correct).length}</div><div class="note">每次判定单独记录</div></div><div class="kpi"><div class="k">最近仍错的题</div><div class="v">${wrong.length}</div><div class="note">按题目最近一次结果</div></div><div class="kpi"><div class="k">已读专题</div><div class="v">${db.read.length}</div><div class="note">总共 ${DATA.topics.length} 个</div></div></div>

}

 <div class="section-head"><h2>自定义题目</h2><small>${db.userQuestions.length} 道</small></div><div class="panel">${db.userQuestions.length?db.userQuestions.map(q=>`<div class="item-row"><div><strong>${esc(q.id)} · ${esc(q.prompt.slice(0,85))}</strong><p>${esc(topicMap[q.topic]?.name||q.topic)} · ${esc(q.difficulty)} · ${esc(q.origin)}</p></div><div class="actions" style="margin:0"><button class="btn mini" data-action="openQuestion" data-id="${q.id}">练习</button><button class="btn mini danger" data-action="deleteQuestion" data-id="${q.id}">删除</button></div></div>`).join(''):'<div class="empty">暂无自定义题目。</div>'}</div>

function resetAttempt(){ui.draft='';ui.choice=-1;ui.revealed=false;ui.graded=null}
function go(page){ui.page=page;render();scrollTo(0,0)}
function openTopic(id){if(!topicMap[id])return;ui.topic=id;ui.topicTab='all';ui.matrixSelected=null;ui.treeSelected=null;db.visited[id]=Date.now();save();go('topic')}
function openQuestion(id){const q=questionById(id);if(!q)return;ui.questionId=id;ui.qFilter='all';ui.difficulty='all';ui.reviewOnly=false;resetAttempt();go('trainer')}
function beginTopic(id){ui.qFilter=id;ui.difficulty='all';ui.reviewOnly=false;ui.questionId=(allQuestions().find(q=>q.topic===id)||{}).id;resetAttempt();go('trainer')}
function addAttempt(q,correct){const old=db.schedule[q.id]||{streak:0},streak=correct?old.streak+1:0;const days=correct?(streak===1?2:streak===2?7:14):0;
 db.attempts.push({question:q.id,topic:q.topic,correct:!!correct,difficulty:q.difficulty,errorTag:q.contrast||q.error||'未分类',date:Date.now(),submitted:q.kind==='choice'?ui.choice:q.kind==='numeric'?ui.draft:'自评'});
 db.schedule[q.id]={streak,due:Date.now()+days*24*3600*1000};save();ui.graded={correct:!!correct};ui.revealed=true;render();}
function submitAnswer(){const q=questionById(ui.questionId);if(!q||ui.revealed)return;
 if(q.kind==='choice'){if(ui.choice<0){alert('请先选择一个选项。');return}addAttempt(q,ui.choice===q.answer);return}
 ui.draft=document.getElementById('answer-draft')?.value||ui.draft;
 if(!ui.draft.trim()){alert('请先独立完成作答。');return}
 if(q.kind==='numeric'){const v=parseMath(ui.draft);if(Number.isNaN(v)){alert('请输入有效数值或形如 2/3 的分数。');return}addAttempt(q,Math.abs(v-Number(q.answer))<=.005);return}
 ui.revealed=true;render();}
function exportData(){const b=new Blob([JSON.stringify({format:'game-theory-training-desk',version:1,exportedAt:new Date().toISOString(),db},null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(b);link.download=`博弈论学习记录_${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),500)}
const uniqueId=prefix=>`${prefix}${Date.now().toString(36)}${Math.floor(Math.random()*10000).toString(36)}`;
const validDb=x=>x&&typeof x==='object'&&Array.isArray(x.attempts)&&Array.isArray(x.read)&&Array.isArray(x.supplements)&&Array.isArray(x.userQuestions)&&typeof x.schedule==='object';
function handleImport(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(raw.format!=='game-theory-training-desk'||!validDb(raw.db))throw Error('文件不是训练台导出的有效备份。');if(!confirm('导入将覆盖当前浏览器中的全部作答和自编内容。是否继续？'))return;db={...defaultDb(),...raw.db};save();ui.page='home';resetAttempt();render();alert('学习记录导入成功。')}catch(e){alert('导入失败：'+e.message)}};r.readAsText(file)}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function onSupplement(form){const d=formData(form),image=document.getElementById('supplement-image')?.files?.[0];if(!d.title?.trim()){alert('请填写标题。');return}
 const store=(img='')=>{db.supplements.push({id:uniqueId('S'),topic:d.topic,kind:d.kind,title:d.title.trim(),content:d.content||'',url:u(d.url),image:img,date:Date.now()});const persisted=save();render();alert(persisted?'补充条目已保存到当前浏览器。':'补充内容已加入本次会话；当前环境不允许持久存储，请立即导出备份。')};
 if(image){if(!/^image\/(png|jpeg|webp|gif)$/.test(image.type)){alert('请选择 PNG、JPEG、WebP 或 GIF。');return}if(image.size>350*1024){alert('图片超过 350 KB；建议压缩或改用 GitHub 图解链接。');return}const reader=new FileReader();reader.onload=()=>store(reader.result);reader.readAsDataURL(image)}else store();}
function onNewQuestion(form){const d=formData(form),steps=String(d.steps||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);let ans=d.answer,opts=[];
 if(d.kind==='choice'){opts=String(d.options||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);const n=parseInt(ans,10);if(opts.length!==4||!Number.isInteger(n)||n<1||n>4){alert('单选题需要 4 个选项，正确答案填数字 1 至 4。');return}ans=n-1}
 if(d.kind==='numeric'){ans=parseMath(ans);if(!Number.isFinite(ans)){alert('数值题答案必须是数值或形如 2/3 的分数。');return}}
 if(!d.prompt?.trim()||!steps.length){alert('请补齐题干和分步解析。');return}
 const x={id:uniqueId('U'),topic:d.topic,difficulty:d.difficulty,kind:d.kind,prompt:d.prompt.trim(),options:opts,answer:ans,steps,error:d.error||'待补充',contrast:d.contrast||'待分类',origin:d.origin||'自定义题目'};db.userQuestions.push(x);const persisted=save();render();alert(persisted?'已加入自定义题库。':'自定义题已加入本次会话；当前环境不允许持久存储，请立即导出备份。');}
const app=document.getElementById('app');
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='nav')go(el.dataset.page);
 else if(a==='topic')openTopic(el.dataset.topic);
 else if(a==='topicTab'){ui.topicTab=el.dataset.tab;ui.matrixSelected=null;ui.treeSelected=null;render()}
 else if(a==='toggleRead'){db.read=db.read.includes(el.dataset.topic)?db.read.filter(x=>x!==el.dataset.topic):[...db.read,el.dataset.topic];save();render()}
 else if(a==='matrix'){ui.matrixSelected=el.dataset.matrix;render()}
 else if(a==='tree'){ui.treeSelected=el.dataset.path;render()}
 else if(a==='trainTopic')beginTopic(el.dataset.topic);
 else if(a==='openQuestion')openQuestion(el.dataset.id);
 else if(a==='reviewTrain'){ui.qFilter='all';ui.difficulty='all';ui.reviewOnly=true;ui.questionId=dueQuestions()[0]?.id||'';resetAttempt();go('trainer')}
 else if(a==='option'){ui.choice=Number(el.dataset.choice);render()}
 else if(a==='submitAnswer')submitAnswer();
 else if(a==='selfGrade'){const q=questionById(ui.questionId);if(q&&ui.revealed&&!ui.graded)addAttempt(q,el.dataset.correct==='true')}
 else if(a==='retry'||a==='resetAnswer'){resetAttempt();render()}
 else if(a==='manageTopic'){ui.topic=el.dataset.topic;go('manage')}
 else if(a==='deleteSupplement'){if(confirm('删除该补充条目？')){db.supplements=db.supplements.filter(x=>x.id!==el.dataset.id);save();render()}}
 else if(a==='deleteQuestion'){if(confirm('删除该自定义题目？（历史记录会保留，但将无法在题单中再次打开）')){db.userQuestions=db.userQuestions.filter(x=>x.id!==el.dataset.id);save();render()}}
 else if(a==='export')exportData();
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('topic-card')){e.preventDefault();openTopic(e.target.dataset.topic)}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('branch-hit')){e.preventDefault();ui.treeSelected=e.target.dataset.path;render()}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.action==='matrix'){e.preventDefault();ui.matrixSelected=e.target.dataset.matrix;render()}});
app.addEventListener('change',e=>{
 if(e.target.id==='topic-category'){ui.category=e.target.value;render()}
 else if(e.target.id==='q-topic'){ui.qFilter=e.target.value;ui.reviewOnly=false;resetAttempt();ui.questionId='';render()}
 else if(e.target.id==='q-level'){ui.difficulty=e.target.value;resetAttempt();ui.questionId='';render()}
 else if(e.target.id==='review-only'){ui.reviewOnly=e.target.checked;resetAttempt();ui.questionId='';render()}
 else if(e.target.id==='import-file'){handleImport(e.target.files?.[0])}
});
app.addEventListener('input',e=>{if(e.target.id==='topic-search'){const p=e.target.selectionStart;ui.search=e.target.value;render();const f=document.getElementById('topic-search');if(f){f.focus();f.setSelectionRange(p,p)}}else if(e.target.id==='answer-draft')ui.draft=e.target.value});
app.addEventListener('submit',e=>{if(e.target.id==='supplement-form'){e.preventDefault();onSupplement(e.target)}else if(e.target.id==='question-form'){e.preventDefault();onNewQuestion(e.target)}});
render();
})();

</script>
</body>
</html>
